# Oktopus's web entry point, as run by `make oktopus`. Routes by service name
# on Oktopus's network rather than through host ports (upstream's config
# proxies to host.docker.internal), and adds socket.io, which the UI opens on
# the same origin it was served from.
#
# Upstreams are resolved per request through Docker's DNS, so nginx starts and
# keeps running while a backend is down, and finds it again when it returns.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $frontend   frontend:3000;
    set $controller controller:8000;
    set $socketio   socketio:5000;
    set $files      file-server:8004;

    location / {
        proxy_pass            http://$frontend;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade $http_upgrade;
        proxy_set_header      Connection 'upgrade';
        proxy_set_header      Host $host;
        proxy_cache_bypass    $http_upgrade;
        proxy_read_timeout    60;
        proxy_connect_timeout 60;
        proxy_redirect        off;
    }

    location /api {
        proxy_pass            http://$controller;
        proxy_read_timeout    60;
        proxy_connect_timeout 60;
        proxy_redirect        off;
    }

    location /socket.io/ {
        proxy_pass            http://$socketio;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade $http_upgrade;
        proxy_set_header      Connection 'upgrade';
        proxy_set_header      Host $host;
        proxy_read_timeout    3600;
    }

    location /images {
        proxy_pass            http://$files;
        proxy_read_timeout    60;
        proxy_connect_timeout 60;
        proxy_redirect        off;
    }
}
