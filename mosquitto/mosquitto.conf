# Development broker: open, unauthenticated, MQTT 5 capable.
# Fine for a local simulation lab, obviously not for anything else.

listener 1883 0.0.0.0
allow_anonymous true

# Keep the log chatty enough to see agent connects/disconnects, which is useful
# when testing reconnect behaviour.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
