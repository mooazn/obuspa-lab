name: publish images

# Builds the agent and device images for amd64 and arm64, each on a runner of
# that architecture, merges them into one multi-arch manifest, and pushes the
# result to GHCR:
#
#   ghcr.io/<owner>/<repo>/{agent,device}:latest    on every push to main
#   ghcr.io/<owner>/<repo>/{agent,device}:vX.Y.Z    additionally, on a version tag
#
# The first publish creates the packages as private. Package visibility is
# set in the repository's package settings.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [agent, device]
        arch: [amd64, arm64]
        # map each arch onto a runner of that architecture
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by digest only; the merge job attaches the tags to the manifest
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.PREFIX }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max

      - name: Record digest
        run: |
          mkdir -p digests/${{ matrix.image }}
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.image }}/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: digests
          if-no-files-found: error

  merge:
    name: merge manifests and tag
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          set -eu
          TAGS="latest"
          case "${GITHUB_REF}" in
            refs/tags/v*) TAGS="$TAGS ${GITHUB_REF#refs/tags/}" ;;
          esac
          for image in agent device; do
            refs=""
            for f in digests/"$image"/*; do
              refs="$refs ${PREFIX}/${image}@$(cat "$f")"
            done
            tagargs=""
            for t in $TAGS; do tagargs="$tagargs -t ${PREFIX}/${image}:${t}"; done
            echo "== ${image}: ${TAGS} <-${refs}"
            # shellcheck disable=SC2086
            docker buildx imagetools create $tagargs $refs
            docker buildx imagetools inspect "${PREFIX}/${image}:latest"
          done
