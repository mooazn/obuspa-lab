# One simulated CPE: a real OB-USP-AGENT talking MQTT to a real broker, with
# its TR-181 data model served by the Python virtual device.
#
#   docker compose up --build
#   open http://localhost:8080
#
# The agent and the device share /run/vdev so the plug-in can reach the device's
# Unix socket. That volume also holds the agent's sqlite database, so
# `docker compose down -v` is a factory reset.

services:
  broker:
    image: eclipse-mosquitto:2
    container_name: vdev-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 5s
      retries: 10

  device:
    build:
      context: .
      dockerfile: device/Dockerfile
    container_name: vdev-device
    networks:
      default:
        aliases: [mosquitto]
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - vdev-run:/run/vdev
      - ./sdcard:/sdcard:ro
    environment:
      VDEV_SOCK: /run/vdev/vdev.sock
      VDEV_HTTP_PORT: "8080"
      VDEV_BROKER_HOST: broker
      VDEV_BROKER_PORT: "1883"
      VDEV_WAN_PORT: "1883"
      VDEV_STATE_FILE: /run/vdev/device-state.json
      VDEV_SDCARD_DIR: /sdcard
      VDEV_DATA_PATH: ${VDEV_DATA_PATH:-/data}
      # How long the device stays unreachable during a simulated reboot
      VDEV_REBOOT_SECONDS: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(socket.AF_UNIX); s.connect('/run/vdev/vdev.sock')"]
      interval: 3s
      timeout: 3s
      retries: 20

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
      args:
        OBUSPA_VERSION: v11.0.0-master
    container_name: vdev-agent
    init: true
    # Device.Reboot() makes obuspa exit. Restarting it here is what turns that
    # into a realistic reboot: the controller sees a disconnect, a reconnect,
    # and a genuine Boot! event from the agent.
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
      device:
        condition: service_healthy
    volumes:
      - vdev-run:/run/vdev
      # The "SD card": `make flash` writes an obuspa build here; the entrypoint
      # boots from it when the device has the card seated.
      - ./sdcard:/sdcard:ro
      # The "data partition": a small tmpfs that vendor code can read with
      # plain statvfs() and that the fault injector can fill. Sized so that
      # "95% full" is a real, cheap condition. Does not survive a reboot of
      # the container - the device re-applies faults on every boot.
      - type: tmpfs
        target: ${VDEV_DATA_PATH:-/data}
        tmpfs:
          size: ${VDEV_DATA_SIZE:-67108864}
    environment:
      VDEV_SOCK: /run/vdev/vdev.sock
      VDEV_DB: /run/vdev/usp.db
      VDEV_LOG_LEVEL: "4"
      VDEV_DATA_PATH: ${VDEV_DATA_PATH:-/data}

volumes:
  vdev-run:
